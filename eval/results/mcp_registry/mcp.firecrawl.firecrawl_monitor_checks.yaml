command: mcp.firecrawl.firecrawl_monitor_checks
version: 1.0.0
description: '

  List historical checks for a monitor, optionally filtered by status and bounded
  by a result limit. Returns one page of check summaries and pagination metadata.

  '
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: destructive
idempotent: false
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    id:
      type: string
    limit:
      type: integer
      exclusiveMinimum: 0
      maximum: 9007199254740991
    offset:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    status:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      - partial
      - skipped_overlap
  required:
  - id
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - firecrawl-mcp
  tool_name: firecrawl_monitor_checks
mcp_pin: sha256:62afcee6c870b01bbd28a28ca1ff3cd6e7dc5d5c663cb460f1b4ecc96a3e3835
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_monitor_checks
  description: '

    List historical checks for a monitor, optionally filtered by status and bounded
    by a result limit. Returns one page of check summaries and pagination metadata.

    '
  inputSchema: *id001
