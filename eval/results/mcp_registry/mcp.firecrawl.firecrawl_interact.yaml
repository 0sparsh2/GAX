command: mcp.firecrawl.firecrawl_interact
version: 1.0.0
description: '

  Open or reuse a live browser session to navigate a page, click controls, fill fields,
  or run browser code. Provide either `url` or `scrapeId`, and either a natural-language
  `prompt` or executable `code`; code can run as Bash, Python, or Node with a bounded
  timeout.


  This acts on the live site, so a'
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: destructive
idempotent: false
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    scrapeId:
      type: string
      minLength: 1
    url:
      type: string
      format: uri
    prompt:
      type: string
      minLength: 1
    code:
      type: string
      minLength: 1
    language:
      type: string
      enum:
      - bash
      - python
      - node
    timeout:
      type: number
      minimum: 1
      maximum: 300
    scrapeOptions:
      type: object
      properties:
        formats:
          type: array
          items:
            type: string
            enum:
            - markdown
            - html
            - rawHtml
            - screenshot
            - links
            - summary
            - changeTracking
            - branding
            - json
            - query
            - audio
        jsonOptions:
          type: object
          properties:
            prompt:
              type: string
            schema:
              type: object
              propertyNames:
                type: string
              additionalProperties: false
          additionalProperties: false
        queryOptions:
          type: object
          properties:
            prompt:
              type: string
              maxLength: 10000
            mode:
              default: freeform
              type: string
              enum:
              - directQuote
              - freeform
          required:
          - prompt
          additionalProperties: false
        screenshotOptions:
          type: object
          properties:
            fullPage:
              type: boolean
            quality:
              type: number
            viewport:
              type: object
              properties:
                width:
                  type: number
                height:
                  type: number
              required:
              - width
              - height
              additionalProperties: false
          additionalProperties: false
        parsers:
          type: array
          items:
            type: string
            enum:
            - pdf
        pdfOptions:
          type: object
          properties:
            maxPages:
              type: integer
              minimum: 1
              maximum: 10000
          additionalProperties: false
        onlyMainContent:
          type: boolean
        redactPII:
          type: boolean
        includeTags:
          type: array
          items:
            type: string
        excludeTags:
          type: array
          items:
            type: string
        waitFor:
          type: number
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - wait
                - screenshot
                - scroll
                - scrape
                - click
                - write
                - press
                - executeJavascript
                - generatePDF
              selector:
                type: string
              milliseconds:
                type: number
              text:
                type: string
              key:
                type: string
              direction:
                type: string
                enum:
                - up
                - down
              script:
                type: string
              fullPage:
                type: boolean
            required:
            - type
        mobile:
          type: boolean
        skipTlsVerification:
          type: boolean
        removeBase64Images:
          type: boolean
        location:
          type: object
          properties:
            country:
              type: string
            languages:
              type: array
              items:
                type: string
          additionalProperties: false
        storeInCache:
          type: boolean
        zeroDataRetention:
          type: boolean
        maxAge:
          type: number
        lockdown:
          type: boolean
        proxy:
          type: string
          enum:
          - basic
          - stealth
          - enhanced
          - auto
        profile:
          type: object
          properties:
            name:
              type: string
            saveChanges:
              type: boolean
          required:
          - name
          additionalProperties: false
      additionalProperties: false
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - firecrawl-mcp
  tool_name: firecrawl_interact
mcp_pin: sha256:d920589af8658537956b03c9d726ac22bdfa7a4726693f96f27bdbede4514af7
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_interact
  description: '

    Open or reuse a live browser session to navigate a page, click controls, fill
    fields, or run browser code. Provide either `url` or `scrapeId`, and either a
    natural-language `prompt` or executable `code`; code can run as Bash, Python,
    or Node with a bounded timeout.


    This acts on the live site, so actions such as form submission can create persistent
    external side effects. Returns execution output, stdout/stderr, exit status, and
    session viewing URLs.

    '
  inputSchema: *id001
