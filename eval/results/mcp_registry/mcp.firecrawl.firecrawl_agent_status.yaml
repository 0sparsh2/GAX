mcp_pinned_tool:
  name: firecrawl_agent_status
  description: "\nRetrieve progress or final results for a `firecrawl_agent` job ID.\
    \ A `processing` response is non-terminal and does not contain the final research\
    \ result. Check again after 15\u201330 seconds until the status is `completed`\
    \ or `failed`; a typical research run takes one to three minutes and complex jobs\
    \ can take longer. If the job cannot finish within the task's available time,\
    \ use `firecrawl_search` and `firecrawl_scrape` to complete the requested output.\n\
    \nReturns job status, progress information, and result data when completed.\n"
