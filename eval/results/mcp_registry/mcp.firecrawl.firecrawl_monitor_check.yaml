command: mcp.firecrawl.firecrawl_monitor_check
version: 1.0.0
description: '

  Retrieve one monitor check and its page-level results, optionally filtered by page
  status. Pages report `same`, `new`, `changed`, `removed`, or `error`; configured
  goal judging can add a meaningful-change decision.


  Markdown tracking returns a unified text diff, JSON tracking returns field paths
  wi'
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: read
idempotent: true
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    id:
      type: string
    checkId:
      type: string
    limit:
      type: integer
      exclusiveMinimum: 0
      maximum: 9007199254740991
    skip:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    pageStatus:
      type: string
      enum:
      - same
      - new
      - changed
      - removed
      - error
  required:
  - id
  - checkId
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - firecrawl-mcp
  tool_name: firecrawl_monitor_check
mcp_pin: sha256:c15d401897c9fbd35498516320b8c3147bdd2bd0eee8b80174de8da79ba2b48d
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_monitor_check
  description: '

    Retrieve one monitor check and its page-level results, optionally filtered by
    page status. Pages report `same`, `new`, `changed`, `removed`, or `error`; configured
    goal judging can add a meaningful-change decision.


    Markdown tracking returns a unified text diff, JSON tracking returns field paths
    with previous/current values and a current snapshot, and mixed tracking returns
    both. Returns one page of results plus a `next` URL when more pages exist.

    '
  inputSchema: *id001
