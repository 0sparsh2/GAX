command: mcp.firecrawl.firecrawl_research_search_papers
version: 1.0.0
description: '

  Search paper metadata and abstracts with a natural-language query across the indexed
  corpus, which spans biomedical, life-science, and clinical literature (PubMed, bioRxiv,
  medRxiv) alongside arXiv and other scientific sources. Optional author, category,
  and date filters constrain results.


  Several'
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: read
idempotent: true
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    query:
      type: string
      minLength: 1
      description: Natural-language research topic or question, including methods,
        systems, conditions, populations, interventions, or outcomes when relevant.
    k:
      description: Number of ranked papers to return (default 40).
      type: integer
      minimum: 1
      maximum: 500
    authors:
      description: Author substring filter(s); ALL must match (case-insensitive).
      type: array
      items:
        type: string
    categories:
      description: Paper category filter(s) (e.g. `cs.LG`); ALL provided values must
        match.
      type: array
      items:
        type: string
    from:
      description: Inclusive lower bound on created/updated date (`YYYY-MM-DD`).
      type: string
    to:
      description: Inclusive upper bound on created/updated date (`YYYY-MM-DD`).
      type: string
  required:
  - query
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - firecrawl-mcp
  tool_name: firecrawl_research_search_papers
mcp_pin: sha256:78b4ae800869ed15f832a7cab5acae74dfad6a214e4d5c8150b2bec165a2533d
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_research_search_papers
  description: '

    Search paper metadata and abstracts with a natural-language query across the indexed
    corpus, which spans biomedical, life-science, and clinical literature (PubMed,
    bioRxiv, medRxiv) alongside arXiv and other scientific sources. Optional author,
    category, and date filters constrain results.


    Several distinct framings of the same question surface different papers than a
    single query does.


    Returns ranked papers with canonical IDs, titles, authors, and abstracts.

    '
  inputSchema: *id001
