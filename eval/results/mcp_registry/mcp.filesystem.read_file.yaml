command: mcp.filesystem.read_file
version: 1.0.0
description: 'Read the complete contents of a file as text. DEPRECATED: Use read_text_file
  instead.'
category: mcp/filesystem
adapter: mcp
required_scopes:
- mcp:filesystem:use
side_effects: read
idempotent: true
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    path:
      type: string
    tail:
      description: If provided, returns only the last N lines of the file
      type: number
    head:
      description: If provided, returns only the first N lines of the file
      type: number
  required:
  - path
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - '@modelcontextprotocol/server-filesystem'
  - /tmp
  tool_name: read_file
mcp_pin: sha256:1a19f9c66da8234489eca4a46359ff2adbaed9b04b273e25135123764dbdb991
mcp_pin_imported_from: filesystem
mcp_pinned_tool:
  name: read_file
  description: 'Read the complete contents of a file as text. DEPRECATED: Use read_text_file
    instead.'
  inputSchema: *id001
