command: mcp.firecrawl.firecrawl_crawl
version: 1.0.0
description: '

  Start a multi-page crawl at a website URL, poll it to a terminal state, and return
  the final status and collected data. Scope can be bounded with include/exclude paths,
  depth, page limit, subdomain/external-link controls, sitemap handling, delay, and
  scrape options.


  Crawl results can be large; use'
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: destructive
idempotent: false
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    url:
      type: string
    prompt:
      type: string
    excludePaths:
      type: array
      items:
        type: string
    includePaths:
      type: array
      items:
        type: string
    maxDiscoveryDepth:
      type: number
    sitemap:
      type: string
      enum:
      - skip
      - include
      - only
    limit:
      type: number
    allowExternalLinks:
      type: boolean
    allowSubdomains:
      type: boolean
    crawlEntireDomain:
      type: boolean
    delay:
      type: number
    maxConcurrency:
      type: number
    webhook:
      type: string
    webhookHeaders:
      type: object
      propertyNames:
        type: string
      additionalProperties: false
    deduplicateSimilarURLs:
      type: boolean
    ignoreQueryParameters:
      type: boolean
    scrapeOptions:
      type: object
      properties:
        formats:
          type: array
          items:
            type: string
            enum:
            - markdown
            - html
            - rawHtml
            - screenshot
            - links
            - summary
            - changeTracking
            - branding
            - json
            - query
            - audio
        jsonOptions:
          type: object
          properties:
            prompt:
              type: string
            schema:
              type: object
              propertyNames:
                type: string
              additionalProperties: false
          additionalProperties: false
        queryOptions:
          type: object
          properties:
            prompt:
              type: string
              maxLength: 10000
            mode:
              default: freeform
              type: string
              enum:
              - directQuote
              - freeform
          required:
          - prompt
          additionalProperties: false
        screenshotOptions:
          type: object
          properties:
            fullPage:
              type: boolean
            quality:
              type: number
            viewport:
              type: object
              properties:
                width:
                  type: number
                height:
                  type: number
              required:
              - width
              - height
              additionalProperties: false
          additionalProperties: false
        parsers:
          type: array
          items:
            type: string
            enum:
            - pdf
        pdfOptions:
          type: object
          properties:
            maxPages:
              type: integer
              minimum: 1
              maximum: 10000
          additionalProperties: false
        onlyMainContent:
          type: boolean
        redactPII:
          type: boolean
        includeTags:
          type: array
          items:
            type: string
        excludeTags:
          type: array
          items:
            type: string
        waitFor:
          type: number
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - wait
                - screenshot
                - scroll
                - scrape
                - click
                - write
                - press
                - executeJavascript
                - generatePDF
              selector:
                type: string
              milliseconds:
                type: number
              text:
                type: string
              key:
                type: string
              direction:
                type: string
                enum:
                - up
                - down
              script:
                type: string
              fullPage:
                type: boolean
            required:
            - type
        mobile:
          type: boolean
        skipTlsVerification:
          type: boolean
        removeBase64Images:
          type: boolean
        location:
          type: object
          properties:
            country:
              type: string
            languages:
              type: array
              items:
                type: string
          additionalProperties: false
        storeInCache:
          type: boolean
        zeroDataRetention:
          type: boolean
        maxAge:
          type: number
        lockdown:
          type: boolean
        proxy:
          type: string
          enum:
          - basic
          - stealth
          - enhanced
          - auto
        profile:
          type: object
          properties:
            name:
              type: string
            saveChanges:
              type: boolean
          required:
          - name
          additionalProperties: false
      additionalProperties: false
  required:
  - url
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - firecrawl-mcp
  tool_name: firecrawl_crawl
mcp_pin: sha256:4e7a051560e5e3e1310f7245af461524dd9feb0685269a7dd8792b4cb07298aa
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_crawl
  description: '

    Start a multi-page crawl at a website URL, poll it to a terminal state, and return
    the final status and collected data. Scope can be bounded with include/exclude
    paths, depth, page limit, subdomain/external-link controls, sitemap handling,
    delay, and scrape options.


    Crawl results can be large; use conservative limits when full-site coverage is
    unnecessary. Webhooks and interactive scrape actions are unavailable in safe mode.
    Returns the crawl ID, status, and page data.

    '
  inputSchema: *id001
