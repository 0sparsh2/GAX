mcp_pinned_tool:
  name: firecrawl_map
  description: '

    Enumerate URLs indexed under one website through Firecrawl without fetching each
    page''s content. Use this when the request asks for a site''s URL inventory, when
    several relevant pages must be located, or when the desired page URL is unknown.
    An optional `search` term narrows the URL list, while sitemap, subdomain, query-parameter,
    and result-limit options control coverage.


    Returns matching URLs rather than page bodies. Retrieve one page with `firecrawl_scrape`;
    collect content across multiple pages with `firecrawl_crawl`. Authenticated responses
    can include an `id` for optional map feedback.

    '
  inputSchema: *id001
