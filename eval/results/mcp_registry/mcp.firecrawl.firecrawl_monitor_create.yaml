mcp_pin: sha256:a87d43736527c34a45882680ae111dd7d0d132450efce62a917e1d1e1c1127c6
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_monitor_create
  description: '

    Create a recurring scrape, crawl, or search monitor that compares each check with
    its retained predecessor. The simple form accepts `page`/`pages` or `queries`
    plus a plain-language `goal`; the advanced `body` form controls targets, schedule,
    change-tracking formats, judging, retention, webhook, and notifications.


    In the simple form, a `goal` is required. If `queries` contains one or more non-empty
    values and is supplied with `page`/`pages`, `queries` create the search target
    and page targets are ignored. A monitor schedules future network checks and can
    send configured email or webhook notifications. Returns the created monitor.

    '
  inputSchema: *id001
