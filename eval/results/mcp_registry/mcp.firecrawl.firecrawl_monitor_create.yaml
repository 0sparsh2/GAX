  a plain-language `goal`; the advanced `body` form controls targets, schedule, change-tracking
  formats, judging, retention, webhook, an'
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: destructive
idempotent: false
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    body:
      type: object
      propertyNames:
        type: string
      additionalProperties: false
    page:
      type: string
    pages:
      type: array
      items:
        type: string
    queries:
      type: array
      items:
        type: string
    searchWindow:
      type: string
      enum:
      - 5m
      - 15m
      - 1h
      - 6h
      - 24h
      - 7d
    maxResults:
      type: integer
      minimum: 1
      maximum: 50
    includeDomains:
      type: array
      items:
        type: string
    excludeDomains:
      type: array
      items:
        type: string
    goal:
      type: string
    name:
      type: string
    scheduleText:
      type: string
    timezone:
      type: string
    email:
      type: string
    includeDiffs:
      type: boolean
    webhookUrl:
      type: string
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
