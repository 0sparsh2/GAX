command: mcp.context7.query_docs
version: 1.0.0
description: 'Retrieves and queries up-to-date documentation and code examples from
  Context7 for any programming library or framework.


  You must call ''Resolve Context7 Library ID'' tool first to obtain the exact Context7-compatible
  library ID required to use this tool, UNLESS the user explicitly provides a library'
category: mcp/context7
adapter: mcp
required_scopes:
- mcp:context7:use
side_effects: read
idempotent: true
input_schema: &id001
  type: object
  $schema: https://json-schema.org/draft/2020-12/schema
  properties:
    libraryId:
      type: string
      description: Exact Context7-compatible library ID (e.g., '/mongodb/docs', '/vercel/next.js',
        '/supabase/supabase', '/vercel/next.js/v14.3.0-canary.87') retrieved from
        'resolve-library-id' or directly from user query in the format '/org/project'
        or '/org/project/version'.
    query:
      type: string
      description: "What to look up in the library's documentation, scoped to a single\
        \ concept. Be specific and include relevant details, but keep each query to\
        \ one topic \u2014 if the user's question spans multiple distinct concepts,\
        \ make a separate call per concept instead of combining them, unless the question\
        \ is about how the concepts interact. Good: 'How to set up authentication\
        \ with JWT in Express.js' or 'React useEffect cleanup function examples'.\
        \ Bad (too vague): 'auth' or 'hooks'. Bad (too broad): 'routing and auth and\
        \ caching in Next.js'. The query is sent to the Context7 API for processing.\
        \ Do not include any sensitive or confidential information such as API keys,\
        \ passwords, credentials, personal data, or proprietary code in your query."
  required:
  - libraryId
  - query
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - '@upstash/context7-mcp'
  tool_name: query-docs
mcp_pin: sha256:f2e95030d4e00be68a32fa7acf3476763f1e2c675fefb53417b7e87c077890b4
mcp_pin_imported_from: context7
mcp_pinned_tool:
  name: query-docs
  description: 'Retrieves and queries up-to-date documentation and code examples from
    Context7 for any programming library or framework.


    You must call ''Resolve Context7 Library ID'' tool first to obtain the exact Context7-compatible
    library ID required to use this tool, UNLESS the user explicitly provides a library
    ID in the format ''/org/project'' or ''/org/project/version'' in their query.


    Do not call this tool more than 3 times per question.'
  inputSchema: *id001
