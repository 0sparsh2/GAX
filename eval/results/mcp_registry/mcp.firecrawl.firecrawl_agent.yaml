command: mcp.firecrawl.firecrawl_agent
version: 1.0.0
description: '

  Run web research that returns structured data when the URLs are not known or the
  answer spans several sites. Describe the fields you need in `prompt`, optionally
  pass a JSON `schema` and seed `urls`, and the research agent searches, navigates,
  reads pages, and returns JSON assembled across sources.'
category: mcp/firecrawl
adapter: mcp
required_scopes:
- mcp:firecrawl:use
side_effects: destructive
idempotent: false
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    prompt:
      type: string
      minLength: 1
      maxLength: 10000
    urls:
      type: array
      items:
        type: string
        format: uri
    schema:
      type: object
      propertyNames:
        type: string
      additionalProperties: false
  required:
  - prompt
  additionalProperties: false
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - firecrawl-mcp
  tool_name: firecrawl_agent
mcp_pin: sha256:c17cf7501f6f5b3caf4be78d1bc3f44cee06375a9329f60c1333b104158a5b81
mcp_pin_imported_from: firecrawl
mcp_pinned_tool:
  name: firecrawl_agent
  description: '

    Run web research that returns structured data when the URLs are not known or the
    answer spans several sites. Describe the fields you need in `prompt`, optionally
    pass a JSON `schema` and seed `urls`, and the research agent searches, navigates,
    reads pages, and returns JSON assembled across sources. Use it to research an
    entity plus its fields (founders, pricing, contact details), to build lists and
    datasets (companies, people, products, jobs, papers), and for pages that need
    navigation or interaction to reach the data.


    This call returns only a job ID, not the research result. Read the job with `firecrawl_agent_status`
    until it reaches `completed` or `failed`; a typical research run takes one to
    three minutes. For one known URL use `firecrawl_scrape` (with formats: ["json"]
    for structured output); for a plain lookup that a results page answers, use `firecrawl_search`.

    '
  inputSchema: *id001
