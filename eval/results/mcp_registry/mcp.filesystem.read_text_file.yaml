command: mcp.filesystem.read_text_file
version: 1.0.0
description: 'Read the complete contents of a file from the file system as text. Handles
  various text encodings and provides detailed error messages if the file cannot be
  read. Use this tool when you need to examine the contents of a single file. Use
  the ''head'' parameter to read only the first N lines of a file, '
category: mcp/filesystem
adapter: mcp
required_scopes:
- mcp:filesystem:use
side_effects: read
idempotent: true
input_schema: &id001
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    path:
      type: string
    tail:
      description: If provided, returns only the last N lines of the file
      type: number
    head:
      description: If provided, returns only the first N lines of the file
      type: number
  required:
  - path
output_schema:
  type: object
mcp:
  server_command: npx
  server_args:
  - -y
  - '@modelcontextprotocol/server-filesystem'
  - /tmp
  tool_name: read_text_file
mcp_pin: sha256:1d8b2b6ca5e1073726f4f41ba61ac8c888d2867157d6cf12547c55051c7f482a
mcp_pin_imported_from: filesystem
mcp_pinned_tool:
  name: read_text_file
  description: Read the complete contents of a file from the file system as text.
    Handles various text encodings and provides detailed error messages if the file
    cannot be read. Use this tool when you need to examine the contents of a single
    file. Use the 'head' parameter to read only the first N lines of a file, or the
    'tail' parameter to read only the last N lines of a file. Operates on the file
    as text regardless of extension. Only works within allowed directories.
  inputSchema: *id001
